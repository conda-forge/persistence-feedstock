schema_version: 1

context:
  version: "5.6"
  test_modules:
    - Persistence.tests.test_ec
    - Persistence.tests.test_mapping
    - Persistence.tests.test_persistent

package:
  name: persistence
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/persistence/persistence-${{ version }}.tar.gz
  sha256: 5211c5319f6677741e4b573d7fe22d6fb0d308938d7216ce132dbd835064c69f

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - extensionclass
    - persistent

tests:
  - python:
      imports:
        - Persistence
        - Persistence._Persistence
        - Persistence.mapping
      pip_check: true
  - script:
      - python -m unittest -v ${{ test_modules | join(" ") }}

about:
  homepage: https://github.com/zopefoundation/Persistence
  repository: https://github.com/zopefoundation/Persistence
  summary: Persistent ExtensionClass
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
